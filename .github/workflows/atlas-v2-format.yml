name: Atlas V2 formatter (temporary)
on:
  push:
    branches:
      - feature/atlas-v2-editor-iphones
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atlas-v2-editor-iphones
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Autoformat touched files
        run: bunx biome check --write server/index.ts server/routes/atlas.ts src/app.tsx src/pages/atlas/index.tsx src/pages/atlas/library.tsx src/pages/atlas/iphones.tsx || true
      - name: Commit formatting
        run: |
          git config user.name "Atlas V2 Formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/index.ts server/routes/atlas.ts src/app.tsx src/pages/atlas/index.tsx src/pages/atlas/library.tsx src/pages/atlas/iphones.tsx
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "style(atlas-v2): formatar código com Biome"
            git push origin HEAD:feature/atlas-v2-editor-iphones
          fi
