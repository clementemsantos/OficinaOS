name: Atlas formatting (temporary)

on:
  push:
    branches:
      - feature/atlas-reparacoes

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/atlas-reparacoes
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: Format and apply safe automatic lint fixes to Atlas changes
        run: |
          bunx biome check --write --unsafe             src/app.tsx             src/lib/navigation.ts             src/lib/repair-atlas.ts             src/lib/__tests__/repair-atlas.test.ts             src/components/modules/atlas/device-diagram.tsx             src/pages/atlas/index.tsx             src/pages/jobs/detail.tsx || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app.tsx src/lib/navigation.ts src/lib/repair-atlas.ts             src/lib/__tests__/repair-atlas.test.ts             src/components/modules/atlas/device-diagram.tsx             src/pages/atlas/index.tsx src/pages/jobs/detail.tsx
          if ! git diff --cached --quiet; then
            HUSKY=0 git commit -m "style(atlas): aplicar formatação Biome e correções automáticas"
            git push origin HEAD:feature/atlas-reparacoes
          fi
